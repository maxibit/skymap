name: skymap

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skymap-web
    restart: unless-stopped
    init: true
    ports:
      - "${SKYMAP_BIND_ADDRESS:-127.0.0.1}:${SKYMAP_PORT:-8088}:8000"
    volumes:
      - sky_data:/app/data
      - app_runtime:/app/runtime
    environment:
      TZ: UTC
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: skymap-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sky_data:
  app_runtime:
